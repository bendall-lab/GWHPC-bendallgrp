site_name: Bendall Group HPC Guide
site_description: Directory conventions, tooling, and workflows for the Bendall group on GW Pegasus
site_url: https://bendall-lab.github.io/GWHPC-bendallgrp/
repo_url: https://github.com/bendall-lab/GWHPC-bendallgrp
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
    - First-time admin setup: setup-admin.md
    - First-time user setup: setup-user.md
  - Installed apps:
    - Overview and conventions: apps/index.md
    - Miniforge3: apps/miniforge3.md
  - 1. Storage tiers: 01-storage-tiers.md
  - 2. Directory layout: 02-directory-layout.md
  - 3. Permissions: 03-permissions.md
  - 4. Conda and software: 04-conda.md
  - 5. SLURM and partitions: 05-slurm-and-partitions.md
  - 6. Snakemake 9+: 06-snakemake.md
  - 7. New project: 07-new-project.md
  - 8. Publishing these docs: 08-publishing-docs.md
  - 9. Reference data: 09-references.md
  - 10. Usernames and handles: 10-user-names.md
  - 11. Group shell setup: 11-shell-setup.md
